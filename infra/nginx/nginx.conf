worker_processes 1;
pid "/home/icaruslee/Projects/javaweb/infra/nginx/run/nginx.pid";
error_log "/home/icaruslee/Projects/javaweb/infra/nginx/run/logs/error.log" warn;

events { worker_connections 128; }

http {
  include /etc/nginx/mime.types;   # 关键：让 .js 是 text/javascript、.css 是 text/css（否则 ES 模块会被浏览器拒执行 → 白屏）
  default_type application/octet-stream;
  charset utf-8;
  access_log "/home/icaruslee/Projects/javaweb/infra/nginx/run/logs/access.log";
  client_body_temp_path "/home/icaruslee/Projects/javaweb/infra/nginx/run/tmp/client_body";
  proxy_temp_path "/home/icaruslee/Projects/javaweb/infra/nginx/run/tmp/proxy";
  fastcgi_temp_path "/home/icaruslee/Projects/javaweb/infra/nginx/run/tmp/fastcgi";
  uwsgi_temp_path "/home/icaruslee/Projects/javaweb/infra/nginx/run/tmp/uwsgi";
  scgi_temp_path "/home/icaruslee/Projects/javaweb/infra/nginx/run/tmp/scgi";

  gzip on;
  gzip_types text/plain text/css application/javascript application/json;
  gzip_min_length 100;

  server {
    listen 9090;
    server_name _;

    # 静态站：/train-ui/、/takeout-ui/ 各挂一个 Vue dist
    location /train-ui/ {
      alias /home/icaruslee/Projects/javaweb/frontend/train-ui/dist/;
      index index.html;
      try_files $uri /train-ui/index.html;
    }
    location /takeout-ui/ {
      alias /home/icaruslee/Projects/javaweb/frontend/takeout-ui/dist/;
      index index.html;
      try_files $uri /takeout-ui/index.html;
    }

    # 反代：页面里 axios 的 baseURL=/apitrain 与 /apitakeout
    location /apitrain/ {
      proxy_pass http://127.0.0.1:8084/api/;
      proxy_set_header Host $host;
    }
    location /apitakeout/ {
      proxy_pass http://127.0.0.1:8085/api/;
      proxy_set_header Host $host;
    }

    # 控制台首页：预写一个小 index.html
    location = / {
      root /home/icaruslee/Projects/javaweb/infra/nginx/run;
      try_files /index.html =404;
    }
  }
}
